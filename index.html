{title:"Vocabulary & Grammar · Exercise 2",kind:"quiz",items:[
["Can you help me to translate this English phrasal verb _____ Vietnamese?",["over","in","into","up"],2,"Cấu trúc: translate something into a language = dịch cái gì sang ngôn ngữ nào.","Bạn có thể giúp tôi dịch cụm động từ tiếng Anh này sang tiếng Việt được không?"],
["The teacher asked his students to copy the new words _____ their notebooks.",["over","on","up","into"],3,"Cấu trúc: copy something into something = chép cái gì vào đâu.","Giáo viên yêu cầu học sinh chép các từ mới vào vở."],
["She didn’t take any English classes, but she still spoke English well. She _____ up the language from other workers.",["copied","picked","looked","went"],1,"Phrasal verb pick up = học/lĩnh hội một ngôn ngữ qua tiếp xúc, thực hành.","Cô ấy không tham gia lớp học tiếng Anh nào nhưng vẫn nói tiếng Anh tốt. Cô ấy học ngôn ngữ từ những công nhân khác."],
["Before any exam, I usually _____ over the grammatical points I have learnt.",["look","pick","go","copy"],2,"Phrasal verb go over = xem lại, ôn lại.","Trước bất kỳ kỳ thi nào, tôi thường ôn lại các điểm ngữ pháp đã học."],
["When I started learning English, my mother taught me how to _____ up new words in the dictionary.",["look","pick","go","copy"],0,"Phrasal verb look up = tra cứu (từ trong từ điển).","Khi tôi bắt đầu học tiếng Anh, mẹ dạy tôi cách tra từ mới trong từ điển."]

{title:"Vocabulary & Grammar · Exercise 3",kind:"quiz",items:[

["English and French are two _____ in Canada.",["official languages","first languages","exchange students","varieties"],0,"Canada có hai ngôn ngữ chính thức được nhắc trong câu: English and French.","Tiếng Anh và tiếng Pháp là hai ngôn ngữ chính thức ở Canada."],

["There are many different _____ of the English language spoken around the world.",["variety","varieties","bilingual","fluent"],1,"Sau many different cần danh từ đếm được số nhiều: varieties.","Có nhiều biến thể tiếng Anh khác nhau được sử dụng trên khắp thế giới."],

{title:"Vocabulary & Grammar · Exercise 4",kind:"quiz",items:[
["The new film is about a boy _____ can speak several languages.",["who","which","whose","what"],0,"Who thay cho danh từ chỉ người và làm chủ ngữ trong mệnh đề quan hệ.","Bộ phim mới kể về một cậu bé có thể nói được nhiều thứ tiếng."],
["Lan is a student _____ English vocabulary is the strongest in our class.",["who","which","whose","what"],2,"Whose + noun diễn tả sự sở hữu: vốn từ vựng của Lan.","Lan là học sinh có vốn từ vựng tiếng Anh tốt nhất lớp chúng tôi."],
["The English-English dictionary _____ I bought at this store a few days ago is expensive.",["who","which","when","whose"],1,"Which thay cho danh từ chỉ vật; làm tân ngữ trong mệnh đề quan hệ.","Cuốn từ điển Anh-Anh mà tôi mua ở cửa hàng này vài ngày trước rất đắt."],
["That’s the writer _____ historical fiction I recommended.",["who","which","where","whose"],3,"Whose + noun diễn tả sự sở hữu: tiểu thuyết lịch sử của nhà văn.","Đó là nhà văn mà tôi đã giới thiệu tiểu thuyết lịch sử của ông ấy."],
["Nigeria is a country _____ is one of the largest English-speaking countries in the world.",["who","which","where","whose"],1,"Which thay cho danh từ chỉ vật/nơi chốn “a country” và làm chủ ngữ.","Nigeria là một quốc gia thuộc nhóm những quốc gia nói tiếng Anh lớn nhất thế giới."],

]},

["Do you know anybody <u>whose</u> wants to translate this novel into English?",["know","whose","translate","into"],1,"Whose + danh từ diễn tả sở hữu; ở đây đại từ làm chủ ngữ thay cho anybody nên dùng who. Sửa whose → who.","Bạn có biết ai muốn dịch cuốn tiểu thuyết này sang tiếng Anh không?"],
["The exchange student <u>which</u> knowledge of English grammar is excellent is very friendly.",["which","of","is","friendly"],0,"Cần đại từ sở hữu whose trước danh từ knowledge. Sửa which → whose.","Sinh viên trao đổi có kiến thức ngữ pháp tiếng Anh xuất sắc rất thân thiện."],
["The presenter <u>who</u> accent I like comes from New Zealand.",["who","like","comes","from"],0,"Cần whose + noun để chỉ giọng nói của người thuyết trình. Sửa who → whose.","Người dẫn chương trình có giọng nói mà tôi thích đến từ New Zealand."],
["My parents bought me an Ipad <u>whose</u> I usually use to learn English.",["bought","an","whose","to"],2,"Ipad là vật; dùng which làm tân ngữ cho use. Sửa whose → which.","Bố mẹ mua cho tôi một chiếc iPad mà tôi thường dùng để học tiếng Anh."]
]},

["She spoke to the man _____.",["whose translated novels I like the most","who is fluent in English and French","which came in the morning post","who has a strong love for English"],0,"Whose thay cho tính từ sở hữu his: whose translated novels.","Cô ấy đã nói chuyện với người đàn ông có những cuốn tiểu thuyết dịch mà tôi thích nhất."],
["He is the translator _____.",["which the scientist is giving","who is fluent in English and French","whose translated novels I like","which came in the morning post"],1,"Who thay cho người (the translator) và làm chủ ngữ.","Ông ấy là dịch giả thông thạo tiếng Anh và tiếng Pháp."],
["I don’t understand the presentation _____.",["who is fluent in English and French","whose translated novels I like","which the scientist is giving","who has a strong love for English"],2,"Which thay cho vật (presentation), làm tân ngữ trong mệnh đề quan hệ.","Tôi không hiểu bài thuyết trình mà nhà khoa học đang trình bày."],
["My close friend _____ advises me to copy new words into a vocabulary notebook.",["who can speak excellent English","which came in the morning post","whose translated novels I like","who is fluent in French"],0,"Who thay cho người (my close friend), làm chủ ngữ của mệnh đề quan hệ.","Người bạn thân có thể nói tiếng Anh rất tốt khuyên tôi chép từ mới vào sổ từ vựng."],
["My daughter _____ dreams of becoming an English teacher.",["which the scientist is giving","whose translated novels I like","who has a strong love for English","which came in the morning post"],2,"Who thay cho người (my daughter), làm chủ ngữ.","Con gái tôi, người rất yêu thích tiếng Anh, mơ ước trở thành giáo viên tiếng Anh."]

{title:"Speaking · Exercise 1",kind:"quiz",items:[
["A: Good luck with your final exam. B: _____",["Thanks. I’ll try my best.","No, thank you.","Thanks. I’d love, too.","Yes, I agree with you."],0,"Đáp lại lời chúc may mắn phù hợp nhất là cảm ơn và thể hiện quyết tâm.","A: Chúc may mắn với kỳ thi cuối kỳ. B: Cảm ơn. Tôi sẽ cố gắng hết sức."],
["A: Are you giving a presentation tomorrow? I wish you all the best of luck. B: _____",["No, I am not.","Yes, I am.","Thank you so much.","Thanks. I’m going with you."],2,"Khi được chúc may mắn, đáp lại bằng lời cảm ơn.","A: Ngày mai bạn thuyết trình à? Chúc bạn mọi điều may mắn. B: Cảm ơn bạn rất nhiều."],
["A: Son, good luck with your new job. B: _____",["Yes, I’m doing a new job.","Thanks, Dad. I’ll make you proud.","No, I couldn’t do it.","Thanks for sharing with me."],1,"Câu trả lời phù hợp với lời chúc của bố: cảm ơn và hứa sẽ làm bố tự hào.","A: Con trai, chúc con may mắn với công việc mới. B: Cảm ơn bố. Con sẽ khiến bố tự hào."],
["A: Best of luck with your new language project. B: _____",["Yes, I’m learning a new language.","Yes, I can teach you a new language.","Thanks. You can ask another question.","Thanks, I really need it."],3,"Đáp lại lời chúc bằng lời cảm ơn tự nhiên.","A: Chúc may mắn với dự án ngôn ngữ mới. B: Cảm ơn, tôi thực sự cần điều đó."],
["A: I know you’re applying for the English speaking club. Break a leg! B: _____",["Thanks. I’ll try my best.","Sure. I like that club very much.","Thank you. Welcome to the club.","Yes, I feel better now."],0,"Break a leg là thành ngữ chúc may mắn; đáp lại bằng lời cảm ơn.","A: Tôi biết bạn đang đăng ký câu lạc bộ nói tiếng Anh. Chúc may mắn nhé! B: Cảm ơn. Tôi sẽ cố gắng hết sức."]
]},
{title:"Speaking · Exercise 2",kind:"quiz",items:[
["Phong: (1) _____",["I read lots of different types. However, choose books that suit your age and English level.","Yes, it will help us remember the word better.","Sure. The first tip is reading in English. When we learn a new word as part of a story, we can remember it better because it is in a context.","That’s right. I add the definition of the word in English, a note on its pronunciation and even a drawing if it’s possible.","I do that, too. Whenever I see a new word, I write it down in my vocabulary notebook.","One more tip is revising new words regularly."],2,"C trả lời trực tiếp câu hỏi xin mẹo học từ vựng và giới thiệu mẹo đầu tiên là đọc tiếng Anh.","Phong: Chắc chắn rồi. Mẹo đầu tiên là đọc bằng tiếng Anh. Khi học từ mới trong câu chuyện, chúng ta nhớ tốt hơn vì từ nằm trong ngữ cảnh."],
["Phong: (2) _____",["I read lots of different types. However, choose books that suit your age and English level.","Yes, it will help us remember the word better.","Sure. The first tip is reading in English.","That’s right. I add the definition of the word in English.","I do that, too.","One more tip is revising new words regularly."],0,"A trả lời câu hỏi nên chọn loại sách nào: chọn sách phù hợp độ tuổi và trình độ.","Tôi đọc nhiều thể loại khác nhau. Tuy nhiên, hãy chọn sách phù hợp với độ tuổi và trình độ tiếng Anh của bạn."],
["Phong: (3) _____",["I read lots of different types.","Yes, it will help us remember the word better.","Sure. The first tip is reading in English.","That’s right. I add the definition of the word in English.","I do that, too.","One more tip is revising new words regularly."],1,"B trả lời câu hỏi có cần chép từ vào vở không.","Có, việc đó sẽ giúp chúng ta nhớ từ tốt hơn."],
["Phong: (4) _____",["I read lots of different types.","Yes, it will help us remember the word better.","Sure. The first tip is reading in English.","That’s right. I add the definition of the word in English, a note on its pronunciation and even a drawing if it’s possible.","I do that, too.","One more tip is revising new words regularly."],3,"D tiếp nối ý ghi từ mới, bổ sung định nghĩa, cách phát âm và hình vẽ.","Đúng vậy. Tôi thêm định nghĩa bằng tiếng Anh, ghi chú cách phát âm và cả hình vẽ nếu có thể."],
["Phong: (5) _____",["I read lots of different types.","Yes, it will help us remember the word better.","Sure. The first tip is reading in English.","That’s right. I add the definition of the word in English.","One more tip is revising new words regularly.","I do that, too. Whenever I see a new word, I write it down in my vocabulary notebook."],5,"E? Không; câu này đáp lại lời khen về ý tưởng vẽ hình và chia sẻ cách ghi từ mới vào sổ.","Tôi cũng làm vậy. Bất cứ khi nào thấy từ mới, tôi ghi nó vào sổ tay từ vựng."],
["Phong: (6) _____",["I read lots of different types.","Yes, it will help us remember the word better.","Sure. The first tip is reading in English.","That’s right. I add the definition of the word in English.","One more tip is revising new words regularly. Make sure you look at the words again and again. If you do this, the words will go into your long-term memory.","I do that, too."],4,"Đây là lời khuyên bổ sung cuối cùng, phù hợp với câu hỏi “Is that all?”.","Một mẹo nữa là thường xuyên ôn từ mới. Hãy xem lại từ nhiều lần để chúng đi vào trí nhớ dài hạn."]
]},
{title:"Reading · Exercise 1",kind:"reading",passage:`<h3>Why Some People Find Learning English Difficult</h3><p>Some people find it really difficult to learn English, and here are some of the reasons. Firstly, English has one of the biggest vocabularies (1) _____ all languages. Therefore, it is very hard for English learners to remember all the words and phrases as well as use them (2) _____ in different contexts. Secondly, English grammar is complex. For example, there are twelve basic tenses in English. This (3) _____ learners confused when they have to use the tenses correctly in different sentences.</p><p>(4) _____ grammatical points, such as prepositions, reported speech, and the passive voice are not any less challenging. Thirdly, a lot of learners find English pronunciation very (5) _____. Words which have the same combination of letters may be (6) _____ differently. For instance, the ‘ou’ in ‘rough’ is not pronounced the same as that in ‘through’. Another problem is sentence stress. Stress (7) _____ we put on different words may lead to the difference in meaning.</p><p>In general, English vocabulary, grammar, and pronunciation may (8) _____ learning it not an easy task.</p>`,translation:`Một số người thấy việc học tiếng Anh thực sự khó khăn, và đây là một vài lý do. Thứ nhất, tiếng Anh có một trong những vốn từ vựng lớn nhất trong tất cả các ngôn ngữ. Vì vậy, người học tiếng Anh rất khó ghi nhớ tất cả từ và cụm từ cũng như sử dụng chúng chính xác trong các ngữ cảnh khác nhau. Thứ hai, ngữ pháp tiếng Anh phức tạp. Ví dụ, tiếng Anh có mười hai thì cơ bản. Điều này khiến người học bối rối khi phải sử dụng thì chính xác trong các câu khác nhau.</p><p>Các điểm ngữ pháp khác, chẳng hạn như giới từ, câu tường thuật và thể bị động cũng không kém phần thách thức. Thứ ba, nhiều người học thấy cách phát âm tiếng Anh rất khó hiểu. Những từ có cùng tổ hợp chữ cái có thể được phát âm khác nhau. Ví dụ, “ou” trong “rough” không được phát âm giống như trong “through”. Một vấn đề khác là trọng âm câu. Trọng âm mà chúng ta đặt vào các từ khác nhau có thể dẫn đến sự khác biệt về ý nghĩa.</p><p>Nói chung, từ vựng, ngữ pháp và cách phát âm tiếng Anh có thể khiến việc học ngôn ngữ này không phải là nhiệm vụ dễ dàng.</p>`,items:[
["Blank (1)",["of","in","on","for"],0,"Cụm so sánh nhất trong phạm vi: one of the biggest ... of all languages.","Tiếng Anh có một trong những vốn từ vựng lớn nhất trong tất cả các ngôn ngữ."],
["Blank (2)",["correct","corrective","incorrectly","correctly"],3,"Sau động từ use cần trạng từ correctly để bổ nghĩa cho động từ.","... sử dụng chúng chính xác trong các ngữ cảnh khác nhau."],
["Blank (3)",["gets","gives","makes","allows"],2,"Cấu trúc make somebody + adjective: khiến ai trở nên thế nào.","Điều này khiến người học bối rối..."],
["Blank (4)",["Another","Other","Others","The other"],1,"Other + danh từ số nhiều: những ... khác.","Các điểm ngữ pháp khác ... cũng không kém phần thách thức."],
["Blank (5)",["confuse","confused","confusing","confusion"],2,"Tính từ confusing mô tả sự vật gây bối rối; pronunciation là nguyên nhân gây khó hiểu.","Nhiều người học thấy cách phát âm tiếng Anh rất khó hiểu."],
["Blank (6)",["written","pronounced","said","read"],1,"Cụm be pronounced = được phát âm.","Các từ có cùng tổ hợp chữ cái có thể được phát âm khác nhau."],
["Blank (7)",["who","whose","the","Ø"],3,"“Stress we put on different words” là cấu trúc mệnh đề quan hệ lược đại từ quan hệ làm tân ngữ.","Trọng âm mà chúng ta đặt vào các từ khác nhau có thể dẫn đến khác biệt về ý nghĩa."],
["Blank (8)",["make","get","let","bring"],0,"Cấu trúc make + O + adjective/noun phrase: khiến điều gì trở thành...","Từ vựng, ngữ pháp và phát âm có thể khiến việc học tiếng Anh không dễ dàng."]
]},
{title:"Reading · Exercise 2",kind:"reading",passage:`<h3>British English and American English</h3><p>British English and American English (1) _____ in some ways. The most remarkable difference between the two (2) _____ is vocabulary. British people call the place where people take their car to buy (3) _____ or oil a petrol station. However, Americans call it a gas station. The British live in flats (4) _____ the Americans live in apartments. Another difference between these two varieties of English is the (5) _____. There are hundreds of minor differences of this type.</p><p>Some words (6) _____ humour, flavour or neighbour exist in British English while in American English these words are written without ‘u’ before ‘r’. Besides, verbs (7) _____ in -se in British English are written with the ending -ze in American English. Some of (8) _____ verbs are analyse - analyze, organise - organize, and minimise - minimize.</p><p><strong>Word box:</strong> spelling – differ – these – petrol – ending – varieties – like – while</p>`,translation:`Tiếng Anh Anh và tiếng Anh Mỹ khác nhau ở một số điểm. Sự khác biệt đáng chú ý nhất giữa hai biến thể là từ vựng. Người Anh gọi nơi mọi người đưa xe đến để mua xăng hoặc dầu là “petrol station”. Tuy nhiên, người Mỹ gọi đó là “gas station”. Người Anh sống trong căn hộ (“flats”) trong khi người Mỹ sống trong căn hộ (“apartments”). Một điểm khác biệt khác giữa hai biến thể tiếng Anh này là cách đánh vần. Có hàng trăm khác biệt nhỏ thuộc loại này.</p><p>Một số từ như humour, flavour hoặc neighbour tồn tại trong tiếng Anh Anh, trong khi tiếng Anh Mỹ viết những từ này mà không có chữ “u” trước “r”. Ngoài ra, các động từ kết thúc bằng -se trong tiếng Anh Anh được viết với đuôi -ze trong tiếng Anh Mỹ. Một số động từ này là analyse – analyze, organise – organize và minimise – minimize.</p>`,items:[
["Blank (1)",["differ","different","difference","differs"],0,"Sau chủ ngữ ghép British English and American English cần động từ số nhiều differ.","Tiếng Anh Anh và tiếng Anh Mỹ khác nhau ở một số điểm."],
["Blank (2)",["variety","varieties","various","varied"],1,"Sau the two cần danh từ số nhiều varieties.","Sự khác biệt đáng chú ý nhất giữa hai biến thể là từ vựng."],
["Blank (3)",["petrol","spelling","ending","while"],0,"Petrol là xăng; petrol station là trạm xăng.","Người Anh gọi nơi mua xăng hoặc dầu là trạm xăng."],
["Blank (4)",["like","while","these","differ"],1,"While nối hai mệnh đề có sự đối lập/khác biệt.","Người Anh sống trong flats trong khi người Mỹ sống trong apartments."],
["Blank (5)",["ending","spelling","varieties","petrol"],1,"Spelling = cách đánh vần/chính tả; đoạn sau đưa ra ví dụ khác biệt cách viết.","Một điểm khác biệt khác giữa hai biến thể tiếng Anh này là cách đánh vần."],
["Blank (6)",["these","like","while","differ"],1,"Like dùng để đưa ra ví dụ: such as/like humour, flavour...","Một số từ như humour, flavour hoặc neighbour..."],
["Blank (7)",["ending","ending in","end","ended"],1,"End in -se = kết thúc bằng -se.","Các động từ kết thúc bằng -se trong tiếng Anh Anh..."],
["Blank (8)",["these","those","they","their"],0,"These verbs chỉ các động từ vừa được nhắc đến ở câu trước.","Một số động từ này là analyse – analyze, organise – organize và minimise – minimize."]
]},
{title:"Reading · Exercise 3a",kind:"reading",passage:`<h3>A Girl’s Experiences of Learning Languages</h3><p>I’m a 14-year-old student who enjoys learning different languages. My first language is Vietnamese. When I was very small, my mother always told me stories in Vietnamese. (1) _____.</p><p>I could read quite fluently when I was 5 years old. Mum encouraged me to read suitable books every day. (2) _____. I really enjoyed the fun and engaging English lessons with foreign teachers at my nursery school. At home, Mum began reading simple English stories to me. (3) _____.</p><p>My primary school was a bilingual one. Besides the subjects taught in Vietnamese, we had 10 lessons of English, and another eight lessons of maths, science and IT in English every week. (4) _____. When I entered junior secondary school, Mum encouraged me to learn another foreign language. I didn’t want to go to the language centre, so I chose to learn Spanish with Duolingo. (5) _____. Now I can speak Spanish and read stories in Spanish.</p><p><strong>Options:</strong><br>A. I also started learning English at this age<br>B. I loved them so much that I started learning how to read in Vietnamese<br>C. The lessons were fun and addictive because they were designed like games<br>D. Mum and I also listened to English songs<br>E. This was a really good way to learn the language because we could learn English naturally</p>`,translation:`Tôi là một học sinh 14 tuổi yêu thích học các ngôn ngữ khác nhau. Tiếng mẹ đẻ của tôi là tiếng Việt. Khi tôi còn rất nhỏ, mẹ luôn kể cho tôi nghe những câu chuyện bằng tiếng Việt. Tôi yêu thích chúng đến mức bắt đầu học đọc bằng tiếng Việt.</p><p>Tôi có thể đọc khá trôi chảy khi 5 tuổi. Mẹ khuyến khích tôi đọc những cuốn sách phù hợp mỗi ngày. Tôi cũng bắt đầu học tiếng Anh ở độ tuổi này. Tôi thực sự thích những giờ học tiếng Anh vui nhộn và hấp dẫn với giáo viên nước ngoài ở trường mẫu giáo. Ở nhà, mẹ bắt đầu đọc cho tôi nghe những câu chuyện tiếng Anh đơn giản. Mẹ và tôi cũng nghe các bài hát tiếng Anh.</p><p>Trường tiểu học của tôi là trường song ngữ. Ngoài các môn học bằng tiếng Việt, mỗi tuần chúng tôi có 10 tiết tiếng Anh và thêm 8 tiết toán, khoa học và công nghệ thông tin bằng tiếng Anh. Đây là một cách học ngôn ngữ thực sự tốt vì chúng tôi có thể học tiếng Anh một cách tự nhiên. Khi vào cấp hai, mẹ khuyến khích tôi học thêm một ngoại ngữ. Tôi không muốn đến trung tâm ngoại ngữ nên chọn học tiếng Tây Ban Nha bằng Duolingo. Các bài học rất thú vị và hấp dẫn vì được thiết kế như trò chơi. Bây giờ tôi có thể nói tiếng Tây Ban Nha và đọc truyện bằng tiếng Tây Ban Nha.</p>`,items:[
["Blank (1)",["A","B","C","D","E"],1,"B nói về những câu chuyện tiếng Việt mà người mẹ kể; câu tiếp theo giải thích kết quả là cô bé đọc tiếng Việt trôi chảy lúc 5 tuổi.","Tôi yêu thích những câu chuyện đó đến mức bắt đầu học cách đọc bằng tiếng Việt."],
["Blank (2)",["A","B","C","D","E"],0,"A nối tiếp việc đọc sách phù hợp ở tuổi nhỏ và dẫn đến chi tiết học tiếng Anh ở trường mẫu giáo.","Tôi cũng bắt đầu học tiếng Anh ở độ tuổi này."],
["Blank (3)",["A","B","C","D","E"],3,"D bổ sung hoạt động nghe bài hát tiếng Anh cùng mẹ, phù hợp sau câu chuyện mẹ đọc cho nghe.","Mẹ và tôi cũng nghe các bài hát tiếng Anh."],
["Blank (4)",["A","B","C","D","E"],4,"E tổng kết việc học nhiều môn bằng tiếng Anh ở trường song ngữ là cách học ngôn ngữ tự nhiên.","Đây là một cách học ngôn ngữ thực sự tốt vì chúng tôi có thể học tiếng Anh một cách tự nhiên."],
["Blank (5)",["A","B","C","D","E"],2,"C mô tả các bài học trên Duolingo, ngay trước câu kết quả hiện tại cô bé có thể nói và đọc tiếng Tây Ban Nha.","Các bài học rất thú vị và hấp dẫn vì chúng được thiết kế giống như trò chơi."]
]},
{title:"Reading · Exercise 3b",kind:"reading",passage:`<h3>A Girl’s Experiences of Learning Languages</h3><p>I’m a 14-year-old student who enjoys learning different languages. My first language is Vietnamese. When I was very small, my mother always told me stories in Vietnamese. I loved them so much that I started learning how to read in Vietnamese. I could read quite fluently when I was 5 years old. Mum encouraged me to read suitable books every day. I also started learning English at this age. I really enjoyed the fun and engaging English lessons with foreign teachers at my nursery school. At home, Mum began reading simple English stories to me. Mum and I also listened to English songs.</p><p>My primary school was a bilingual one. Besides the subjects taught in Vietnamese, we had 10 lessons of English, and another eight lessons of maths, science and IT in English every week. This was a really good way to learn the language because we could learn English naturally. When I entered junior secondary school, Mum encouraged me to learn another foreign language. I didn’t want to go to the language centre, so I chose to learn Spanish with Duolingo. The lessons were fun and addictive because they were designed like games. Now I can speak Spanish and read stories in Spanish.</p>`,translation:`Tôi là học sinh 14 tuổi yêu thích học các ngôn ngữ khác nhau. Tiếng mẹ đẻ của tôi là tiếng Việt. Khi còn rất nhỏ, mẹ thường kể chuyện bằng tiếng Việt cho tôi. Tôi yêu những câu chuyện ấy đến mức bắt đầu học đọc tiếng Việt. Tôi có thể đọc khá trôi chảy khi 5 tuổi. Mẹ khuyến khích tôi đọc sách phù hợp mỗi ngày. Tôi cũng bắt đầu học tiếng Anh ở độ tuổi đó. Tôi rất thích những giờ học tiếng Anh vui nhộn, hấp dẫn với giáo viên nước ngoài ở trường mẫu giáo. Ở nhà, mẹ bắt đầu đọc những câu chuyện tiếng Anh đơn giản cho tôi. Mẹ và tôi cũng nghe các bài hát tiếng Anh.</p><p>Trường tiểu học của tôi là trường song ngữ. Ngoài các môn học bằng tiếng Việt, mỗi tuần chúng tôi có 10 tiết tiếng Anh và thêm 8 tiết toán, khoa học và công nghệ thông tin bằng tiếng Anh. Đây là cách học ngôn ngữ rất tốt vì chúng tôi có thể học tiếng Anh một cách tự nhiên. Khi vào cấp hai, mẹ khuyến khích tôi học thêm một ngoại ngữ. Tôi không muốn đến trung tâm ngoại ngữ nên chọn học tiếng Tây Ban Nha bằng Duolingo. Các bài học rất vui và hấp dẫn vì được thiết kế giống như trò chơi. Bây giờ tôi có thể nói tiếng Tây Ban Nha và đọc truyện bằng tiếng Tây Ban Nha.</p>`,items:[
["When could the girl read in Vietnamese?",["When she was 4.","When she was 5.","When she was 6.","When she was 7."],1,"Bài đọc nêu rõ: “I could read quite fluently when I was 5 years old.”","Cô gái có thể đọc tiếng Việt khi nào? – Cô có thể đọc khá trôi chảy khi 5 tuổi."],
["How were the English lessons at her nursery school?",["Difficult and boring.","Short and simple.","Fun and engaging.","Too challenging."],2,"Thông tin trong bài: “the fun and engaging English lessons”.","Các giờ học tiếng Anh ở trường mẫu giáo của cô ấy như thế nào? – Vui nhộn và hấp dẫn."],
["What kind of primary school did she attend?",["A bilingual school.","An international school.","A language centre.","A boarding school."],0,"Bài đọc: “My primary school was a bilingual one.”","Cô ấy học loại trường tiểu học nào? – Trường tiểu học song ngữ."],
["How many English lessons per week did she have at primary school?",["Eight.","Ten.","Twelve.","Eighteen."],1,"Bài đọc nêu 10 tiết tiếng Anh mỗi tuần; thêm 8 tiết các môn khác dạy bằng tiếng Anh.","Cô ấy có bao nhiêu tiết tiếng Anh mỗi tuần ở tiểu học? – 10 tiết."],
["What other subjects did she study in English?",["History, geography and art.","Maths, science and IT.","Literature and music.","Maths, history and PE."],1,"Bài đọc ghi: “another eight lessons of maths, science and IT in English every week.”","Cô ấy học những môn nào khác bằng tiếng Anh? – Toán, khoa học và công nghệ thông tin."],
["Did she learn Spanish in a language centre?",["Yes, she did.","No, she learned it with Duolingo.","No, she learned it at primary school.","The text doesn't say."],1,"Cô bé không muốn đến trung tâm ngoại ngữ nên chọn học tiếng Tây Ban Nha với Duolingo.","Cô ấy có học tiếng Tây Ban Nha ở trung tâm ngoại ngữ không? – Không, cô học bằng Duolingo."]
]},

{title:"Writing · Exercise 2",kind:"writing",items:[

let si=0,qi=0,answers={};
function unlock(){if(document.getElementById('pw').value==='367'){document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');buildTabs();render()}else document.getElementById('pwmsg').textContent='Incorrect password. Try again.'}
function buildTabs(){document.getElementById('tabs').innerHTML=sections.map((s,i)=>`<button class="tab ${i===si?'active':''}" onclick="selectSection(${i})">${s.title}</button>`).join('')}
function selectSection(i){si=i;qi=0;buildTabs();render()}
function count(s){return s.kind==='reading'?s.items.length:s.items.length}
function key(i=qi){return si+'-'+i}
function getScore(){let correct=0,done=0,total=0;sections.forEach((s,i)=>{s.items.forEach((q,j)=>{total++;let a=answers[i+'-'+j];if(a){done++;if(a.correct)correct++}})});return {correct,done,total}}
function render(){let s=sections[si],sc=getScore();document.getElementById('sect').textContent=s.title;document.getElementById('score').textContent=`Score: ${sc.correct} / ${sc.done} answered`;document.getElementById('bar').style.width=(sc.done/sc.total*100)+'%';document.getElementById('prev').disabled=qi===0;document.getElementById('next').disabled=qi>=count(s)-1;document.getElementById('counter').textContent=s.kind==='reading'?'All questions shown':`Question ${qi+1} / ${count(s)}`;
if(s.kind==='reading')renderReading(s);else if(s.kind==='stress')renderStress(s);else if(s.kind==='writing')renderWriting(s);else renderQuiz(s);buildTabs()}
function renderQuiz(s){let q=s.items[qi],a=answers[key()];document.getElementById('content').innerHTML=`<div class="question"><div class="muted">Choose the correct answer.</div><h3>${q[0]}</h3><div class="opts">${q[1].map((o,i)=>`<button class="opt ${a?(i===q[2]?'correct':i===a.choice?'wrong':''):''}" ${a?'disabled':''} onclick="answer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${a?feedback(q,a.correct):''}</div>`}
function answer(i){let q=sections[si].items[qi];if(answers[key()])return;answers[key()]={choice:i,correct:i===q[2]};render()}
function feedback(q,ok){return `<div class="feedback ${ok?'':'bad'}"><b>${ok?'Correct!':'Incorrect.'}</b> Correct answer: <b>${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}</b><div class="vi"><b>Giải thích:</b> ${q[3]||''}</div>${q[4]?`<div class="vi"><b>Dịch nghĩa cả câu:</b> ${q[4]}</div>`:''}</div>`}
function renderStress(s){let q=s.items[qi],a=answers[key()];document.getElementById('content').innerHTML=`<div class="question"><div class="muted">${s.intro}</div><h2>${q[0]} <span class="muted">${q[2]}</span></h2><p>Choose the correct stress pattern:</p><div class="opts">${['oOo','ooOo','Ooo','oOoo'].map((o,i)=>`<button class="opt ${a?(o===q[1]?'correct':o===a.value?'wrong':''):''}" ${a?'disabled':''} onclick="stressAnswer('${o}')">${o}</button>`).join('')}</div>${a?`<div class="feedback ${a.correct?'':'bad'}"><b>${a.correct?'Correct!':'Incorrect.'}</b> Correct pattern: <b>${q[1]}</b><div class="vi">${q[0]} – ${q[2]}. ${s.why}</div></div>`:''}</div>`}
function stressAnswer(v){let q=sections[si].items[qi];if(answers[key()])return;answers[key()]={value:v,correct:v===q[1]};render()}
function renderReading(s){document.getElementById('content').innerHTML=`<div class="reading-layout"><div class="read-pane"><div class="readtext">${s.passage}</div><details><summary>Show Vietnamese translation / Xem bản dịch tiếng Việt</summary><div class="readtext">${s.translation}</div></details></div><div class="q-pane"><h3>${s.title}</h3>${s.items.map((q,i)=>{let a=answers[si+'-'+i];return `<div class="question"><b>${i+1}. ${q[0]}</b><div class="opts">${q[1].map((o,j)=>`<button class="opt ${a?(j===q[2]?'correct':j===a.choice?'wrong':''):''}" ${a?'disabled':''} onclick="readingAnswer(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div>${a?feedback(q,a.correct):''}</div>`}).join('')}</div></div>`}
function readingAnswer(i,j){let q=sections[si].items[i],k=si+'-'+i;if(answers[k])return;answers[k]={choice:j,correct:j===q[2]};render()}
function renderWriting(s){let q=s.items[qi],a=answers[key()];document.getElementById('content').innerHTML=`<div class="question"><div class="muted">Make a sentence using the words and phrases below. You may change the words and add words if necessary.</div><h3>${qi+1}. ${q[0]}</h3><div class="entry"><input id="typed" type="text" placeholder="Type your complete sentence" ${a?'disabled':''}>${a?'':`<button class="btn" onclick="checkWriting()">Check</button>`}</div>${a?`<div class="feedback ${a.correct?'':'bad'}"><b>${a.correct?'Correct!':'Check the model answer below.'}</b><div class="vi"><b>Suggested answer:</b> ${q[1]}</div><div class="vi"><b>Gợi ý cấu trúc:</b> ${q[2]}</div><div class="vi"><b>Nghĩa tiếng Việt:</b> ${q[3]}</div></div>`:''}</div>`}
function checkWriting(){let q=sections[si].items[qi],v=document.getElementById('typed').value.trim();if(!v||answers[key()])return;let norm=x=>x.toLowerCase().replace(/[.,!?']/g,'').replace(/\s+/g,' ').trim();answers[key()]={value:v,correct:norm(v)===norm(q[1])};render()}
function move(d){qi=Math.max(0,Math.min(count(sections[si])-1,qi+d));render()}
function resetSection(){if(!confirm('Reset all answers in this section?'))return;sections[si].items.forEach((_,j)=>delete answers[si+'-'+j]);qi=0;render()}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());
</script></body></html>
